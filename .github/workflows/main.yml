name: Globemart Workflow

on:
  push:
    branches:
      - experiment/docker-setup

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      client_changed: ${{ steps.client_changed.outputs.client }}
      server_changed: ${{ steps.server_changed.outputs.server }}
      socket_changed: ${{ steps.socket_changed.outputs.socket }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for changes in client
        id: client_changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            client:
              - 'client/**'

      - name: Check for changes in server
        id: server_changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'server/**'

      - name: Check for changes in socket
        id: socket_changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            socket:
              - 'socket/**'

  client:
    needs: check-changes
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.client_changed == 'true'
    steps:
      - name: Client working
        run: echo "Client has changed!"

  server:
    needs: check-changes
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.server_changed == 'true'
    steps:
      - name: Server working
        run: echo "Server has changed!"

  socket:
    needs: check-changes
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.socket_changed == 'true'
    steps:
      - name: Socket working
        run: echo "Socket has changed!"
